name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test dan build APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK sudah tersedia di runner ubuntu-latest ($ANDROID_HOME); cukup terima lisensinya.
      - name: Terima lisensi Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Gradle Wrapper dibuat bila belum ada di repository (lihat scripts/setup-wrapper.sh).
      - name: Siapkan Gradle Wrapper
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            sh scripts/setup-wrapper.sh
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Unit test
        run: ./gradlew test --stacktrace

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: CreateApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload laporan test (bila gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-test
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

# Release signing via GitHub Secrets adalah opsi terpisah dan dikerjakan pada Tahap 8.
# Jangan pernah memasukkan keystore atau password ke repository.
