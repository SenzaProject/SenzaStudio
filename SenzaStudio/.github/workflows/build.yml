name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Siapkan aset (android.jar + keystore)
        run: |
          mkdir -p app/src/main/assets
          cp "$ANDROID_HOME/platforms/android-34/android.jar" app/src/main/assets/android.jar
          keytool -J-Dkeystore.pkcs12.legacy -genkeypair \
            -keystore app/src/main/assets/debug.p12 -storetype PKCS12 \
            -storepass android -keypass android -alias forge \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SenzaStudio"
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libaapt2.so ]; then
            echo "::warning::libaapt2.so belum ada; APK tetap jadi tapi fitur Build APK di aplikasi akan error."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SenzaStudio-debug
          path: app/build/outputs/apk/debug/*.apk
