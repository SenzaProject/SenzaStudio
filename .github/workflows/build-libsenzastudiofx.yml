name: Build libsenzastudiofx
on:
  push:
    paths: ["native-fx/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-fx
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (ASAN + UBSAN + TSAN)
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j
          ctest --test-dir build-host --output-on-failure
      - name: Build for Android (arm64-v8a + armeabi-v7a, normal + smoketest)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK=$NDK"
          for ABI in arm64-v8a armeabi-v7a; do
            for VARIANT in normal smoketest; do
              SMOKE=OFF; [ "$VARIANT" = smoketest ] && SMOKE=ON
              cmake -S . -B build-$ABI-$VARIANT -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
                -DSENZAFX_SMOKETEST=$SMOKE
              cmake --build build-$ABI-$VARIANT -j
              mkdir -p out/$VARIANT/$ABI
              cp build-$ABI-$VARIANT/libsenzastudiofx.so out/$VARIANT/$ABI/
            done
          done
      - name: Verify exports and dependencies
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          READELF=$(ls $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf)
          for f in out/*/*/libsenzastudiofx.so; do
            echo "== $f"
            $READELF --dyn-syms "$f" | grep -w AELI || { echo "AELI TIDAK terekspor"; exit 1; }
            NEEDED=$($READELF -d "$f" | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' | tr '\n' ' ')
            echo "NEEDED: $NEEDED"
            for n in $NEEDED; do
              case "$n" in libc.so|libm.so|libdl.so|liblog.so) ;; *) echo "Dependensi tak diizinkan: $n"; exit 1;; esac
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libsenzastudiofx
          path: native-fx/out/
