name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests (P1 exit criteria)
        run: ./gradlew testDebugUnitTest :audio-engine:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SenzaStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  native-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure, build, test (CMake)
        run: |
          cmake -S native/senzafx -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native -j
          ctest --test-dir build-native --output-on-failure

      - name: Sanitizer run (ASan + UBSan)
        run: sh native/senzafx/build_and_test.sh
