name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests (P6 exit criteria: real-time safety, soak, equivalence)
        run: ./gradlew testDebugUnitTest :audio-engine:test :audio-dsp:test --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DSP-measurements
          path: |
            audio-dsp/build/reports/p3-measurements.md
            audio-dsp/build/reports/p6-measurements.md

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SenzaStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
